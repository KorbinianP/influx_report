[project]
name = "influx-report"
version = "0.2.0"
description = "Read and plot energy data from InfluxDB to PNG report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "influxdb-client",
    "matplotlib",
    "numpy",
    "python-dateutil",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
